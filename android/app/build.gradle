plugins {
    id "com.android.application"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Create a variable called keystorePropertiesFile, and initialize it to your
// key.properties file, in the rootProject folder ([project]/android/keys/...).
def keystorePropertiesFile = rootProject.file("keys/key.properties")

// Initialize a new Properties() object called keystoreProperties.
def keystoreProperties = new Properties()

// Load your keystore.properties file into the keystoreProperties object.
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// Release builds need key.properties. ORG_GRADLE_PROJECT_allowDebugSignedRelease=true
// (weight measurement and CI only) signs them with the debug key instead. On Windows the
// name reaches Gradle upper-cased when Flutter starts it, so the variable is read directly.
def allowDebugSignedRelease = System.getenv('ORG_GRADLE_PROJECT_allowDebugSignedRelease') == 'true' || project.findProperty('allowDebugSignedRelease')?.toString() == 'true'

gradle.taskGraph.whenReady { graph ->
    def releaseRequested = graph.allTasks.any { it.name.contains('Release') }
    if (releaseRequested && !keystorePropertiesFile.exists() && !allowDebugSignedRelease) {
        throw new GradleException(
            'Release build needs android/keys/key.properties to sign the release (see "Compilar el APK" in README.md). ' +
            'For weight measurement or CI without the key, set ORG_GRADLE_PROJECT_allowDebugSignedRelease=true (signs with the debug key).'
        )
    }
}

android {
    namespace = "com.monekin.app"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
        // Finanzas IA (T002): flutter_local_notifications needs core library desugaring.
        coreLibraryDesugaringEnabled = true
    }

    defaultConfig {
        applicationId = "com.yosoyepa.finanzas"
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            keyAlias = keystoreProperties['keyAlias']
            keyPassword = keystoreProperties['keyPassword']
            storeFile = keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword = keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            // Finanzas IA (T002): without key.properties this is reached only with allowDebugSignedRelease (see above).
            signingConfig = keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8
    }
}

flutter {
    source = "../.."
}

dependencies {
    // Finanzas IA (T002): required by flutter_local_notifications.
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"
}
